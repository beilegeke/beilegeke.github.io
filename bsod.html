(function(){
  var pct = document.getElementById('pct');

  var params = new URLSearchParams(location.search);

  // 截图 / 演示需要固定进度时使用 ?static=1
  if(params.get('static') === '1'){
    pct.textContent = '0% 完成';

  var n = 0;
  function tick(){
    if(n < 3){
      n += 1;
      pct.textContent = n + '% 完成';
      setTimeout(tick, 1100);

})();
