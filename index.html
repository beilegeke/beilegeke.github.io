<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>安全提示 · 不明来源的二维码请勿随意扫描</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: linear-gradient(180deg, #519df3 0%, #3f8fe8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .poster {
    display: block;
    width: 100%;
    max-width: 100vw;
    height: auto;
  }
  @media (min-width: 768px) {
    body { padding: 24px; }
    .poster {
      width: auto;
      height: calc(100vh - 48px);
      max-height: 100%;
    }
  }
</style>
</head>
<body>
  <img class="poster" src="safety.jpg" alt="安全提示：不明来源的二维码名片请勿随意扫描，避免个人信息被盗取和财产损失">
</body>
</html>
